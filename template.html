<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snoop</title>
<style>
  :root {
    --bg:      #0b0d10;
    --panel:   #111418;
    --panel-2: #161a1f;
    --line:    #222a32;
    --text:    #c7d2de;
    --dim:     #7a8794;
    --dimmer:  #4d5964;

    --commit:  #4c9ffe;
    --merge:   #f5d33a;
    --pr:      #a78bfa;
    --comment: #fc8181;
    --ticket:  #4ade80;

    /* Teams view. PR outcomes are categorical slots 1-4 in this order, checked
       for colour-blind separation against --panel. */
    --series:        #3987e5;
    --pr-completed:  #3987e5;
    --pr-abandoned:  #d95926;
    --pr-active:     #199e70;
    --pr-draft:      #c98500;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
  }

  /* ---------- shell ---------- */

  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 210px;
    flex: 0 0 210px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 16px 18px;
    overflow-y: auto;
  }

  .main { flex: 1; overflow: auto; position: relative; }

  /* ---------- sidebar ---------- */

  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .12em;
    color: #e6edf5;
    margin-bottom: 2px;
  }
  .brand-sub { color: var(--dimmer); font-size: 11px; margin-bottom: 20px; }

  .refresh { margin: -8px 0 22px; }
  .refresh button {
    width: 100%;
    padding: 6px 10px;
    background: var(--panel-2);
    border: 1px solid #2e3843;
    border-radius: 4px;
    color: #e6edf5;
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
  }
  .refresh button:hover:not(:disabled) { border-color: var(--series); }
  .refresh button:disabled { color: var(--dim); cursor: default; }
  .refresh .status { margin-top: 6px; font-size: 11px; color: var(--dimmer); line-height: 1.5; }
  .refresh .status.error { color: var(--comment); white-space: pre-wrap; word-break: break-word; }
  .refresh .settings-link { display: inline-block; margin-top: 8px; color: #9ec5e0; font-size: 12px; text-decoration: none; }
  .refresh .settings-link:hover { text-decoration: underline; }

  .group { margin-bottom: 22px; }
  .group > h4 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 500;
    color: var(--dim);
  }
  .group + .group { border-top: 1px solid var(--line); padding-top: 18px; }

  label.opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    user-select: none;
    font-size: 12.5px;
  }
  label.opt:hover { color: #fff; }
  label.opt input { accent-color: #4c9ffe; margin: 0; cursor: pointer; }
  .swatch { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .opt-count { margin-left: auto; color: var(--dimmer); font-size: 11px; font-variant-numeric: tabular-nums; }

  .meta { font-size: 11px; color: var(--dimmer); line-height: 1.7; }
  .meta code {
    display: block;
    margin-top: 8px;
    padding: 6px 7px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--dim);
    font-size: 10.5px;
    word-break: break-all;
  }

  /* ---------- grid ---------- */

  .grid { display: grid; min-width: min-content; }

  .cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

  .head {
    position: sticky;
    top: 0;
    z-index: 3;
    background: var(--panel-2);
    padding: 9px 10px;
    font-size: 11px;
    letter-spacing: .09em;
    color: var(--dim);
    text-align: center;
    white-space: nowrap;
  }
  .head.today { color: #e6edf5; font-weight: 600; }
  .head.weekend { color: var(--dimmer); font-style: italic; }

  .rowlabel {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--panel);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .rowlabel .name {
    font-size: 12.5px;
    color: #dbe5ef;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rowlabel .tot { font-size: 10.5px; color: var(--dimmer); font-variant-numeric: tabular-nums; }
  .rowlabel.empty .name { color: var(--dimmer); }

  .corner { position: sticky; left: 0; top: 0; z-index: 4; background: var(--panel-2); }

  .daycell { padding: 7px 8px; display: flex; flex-direction: column; gap: 3px; }
  .daycell.weekend { background: rgba(255,255,255,.012); }

  .band { display: flex; flex-wrap: wrap; gap: 3px; min-height: 9px; align-content: flex-start; }

  .pill {
    height: 7px;
    border-radius: 4px;
    opacity: .92;
    cursor: default;
    transition: opacity .1s, transform .1s;
  }
  .pill:hover { opacity: 1; transform: scaleY(1.45); }
  .pill.dot { border-radius: 50%; width: 7px; }

  .pill.commit  { background: var(--commit); }
  .pill.merge   { background: var(--merge); }
  .pill.pr      { background: var(--pr); }
  .pill.comment { background: var(--comment); }
  .pill.ticket  { background: var(--ticket); }

  /* ---------- summary ---------- */

  .summary { padding: 26px 22px 60px; border-top: 1px solid var(--line); margin-top: 4px; }
  .summary h3 { margin: 0 0 14px; font-size: 12px; font-weight: 500; color: var(--dim); letter-spacing: .06em; }
  table { border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 7px 14px 7px 0; text-align: right; white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--line); font-size: 11px; }
  td.who, th.who { text-align: left; color: #dbe5ef; padding-right: 30px; }
  tbody tr:hover { background: rgba(255,255,255,.03); }
  td { font-variant-numeric: tabular-nums; color: var(--text); }
  td.zero { color: var(--dimmer); }

  .banner {
    margin: 0;
    padding: 11px 22px;
    background: #2a2412;
    border-bottom: 1px solid #4a3f1c;
    color: #f0d68a;
    font-size: 12.5px;
  }
  .banner b { color: #ffe9a8; }
  .banner code { background: rgba(0,0,0,.28); padding: 1px 5px; border-radius: 3px; font-size: 11.5px; }

  /* Informational rather than a warning: no roster was configured. */
  .banner.info { background: #12202c; border-bottom-color: #1f3a4d; color: #9ec5e0; }
  .banner.info b { color: #d3e8f7; }

  .unmatched { padding: 0 22px 50px; }
  .unmatched h3 { font-size: 12px; font-weight: 500; color: var(--dim); letter-spacing: .06em; margin: 0 0 6px; }
  .unmatched p { color: var(--dimmer); font-size: 11.5px; margin: 0 0 12px; max-width: 60ch; }
  .unmatched td.who { color: var(--dim); }

  .empty-state { padding: 60px 22px; color: var(--dim); }

  /* ---------- tabs ---------- */

  .tabs {
    display: flex;
    gap: 2px;
    padding: 6px 22px 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .tabs button {
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12.5px;
    padding: 8px 14px 9px;
    cursor: pointer;
  }
  .tabs button:hover { color: #fff; }
  .tabs button.on { color: #e6edf5; border-bottom-color: var(--series); }

  /* ---------- teams ---------- */

  .teams { padding: 22px 22px 60px; max-width: 1500px; }
  .teams h3 { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--dim); letter-spacing: .06em; }
  .team h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; color: #e6edf5; }
  .team-sub { color: var(--dimmer); font-size: 11.5px; margin-bottom: 16px; }
  .chip {
    display: inline-block;
    padding: 1px 7px;
    margin: 0 4px 4px 0;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--dim);
    font-size: 11px;
  }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  .tile.lead { border-color: #2b4a6e; }
  .tile .label { font-size: 11px; color: var(--dim); }
  .tile .value { font-size: 22px; font-weight: 600; color: #e6edf5; margin: 4px 0 2px; }
  .tile .value small { font-size: 12px; font-weight: 400; color: var(--dim); }
  .tile .sub { font-size: 11px; color: var(--dimmer); line-height: 1.5; white-space: pre-line; }

  .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .subtabs button {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    padding: 4px 13px;
    cursor: pointer;
  }
  .subtabs button:hover { color: #fff; border-color: #2e3843; }
  .subtabs button.on { color: #e6edf5; border-color: var(--series); background: #15263a; }

  .chart.wide { grid-column: 1 / -1; }
  .brow { display: grid; grid-template-columns: 70px 44px 1fr; gap: 4px 10px; align-items: center; margin: 4px 0 12px; }
  .brow .blabel { color: #dbe5ef; font-size: 12px; }
  .brow .bcount { color: var(--dim); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .bbar { display: flex; gap: 2px; height: 18px; }
  .bbar > .seg {
    display: block;
    height: 100%;
    min-width: 3px;
    color: #0b0d10;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 18px;
    text-align: center;
    text-decoration: none;
    overflow: hidden;
    white-space: nowrap;
  }
  a.seg:hover { filter: brightness(1.18); outline: 1px solid #e6edf5; outline-offset: 1px; }
  .bbar > .seg:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .bbar > .seg:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .brow a.bcount { color: #9ec5e0; text-decoration: none; }
  .brow a.bcount:hover { text-decoration: underline; }
  .brow .caption { grid-column: 3; margin-top: 0; }
  .flag { color: var(--dimmer); cursor: help; }

  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 8px; min-width: 0; }
  .chart h4 { margin: 0 0 2px; font-size: 12px; font-weight: 500; color: #dbe5ef; }
  .chart .sub { font-size: 11px; color: var(--dimmer); margin-bottom: 8px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--dim); font-size: 10.5px; font-family: inherit; font-variant-numeric: tabular-nums; }
  svg .grid-line { stroke: var(--line); stroke-width: 1; }
  svg .baseline { stroke: #34404c; stroke-width: 1; }
  .hit rect { fill: transparent; }
  .hit .xhair { stroke: var(--dimmer); stroke-width: 1; opacity: 0; }
  .hit:hover .xhair { opacity: 1; }

  .legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11px; color: var(--dim); margin: 0 0 10px; }
  .legend-row span { display: inline-flex; align-items: center; gap: 6px; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .key.line { width: 14px; height: 2px; border-radius: 1px; }
  .key.wash { opacity: .25; }

  .scroll-x { overflow-x: auto; }
  .members td.stackcell { text-align: left; min-width: 230px; }
  .stack { display: flex; gap: 2px; height: 10px; }
  .stack > div { height: 100%; }
  .stack > div:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .stack > div:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .caption { font-size: 10.5px; color: var(--dimmer); margin-top: 4px; }
  .hbar { display: inline-block; height: 8px; margin-right: 7px; vertical-align: middle; background: var(--series); border-radius: 0 4px 4px 0; }
  .spark { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .note { color: var(--dimmer); font-size: 11.5px; max-width: 100ch; margin: 12px 0 0; line-height: 1.6; }
  .note b { color: var(--dim); font-weight: 500; }
  a.teamlink { color: #9ec5e0; text-decoration: none; }
  a.teamlink:hover { text-decoration: underline; }
  a.teamlink.on { color: #e6edf5; font-weight: 600; }

  .tip {
    position: fixed;
    z-index: 50;
    pointer-events: none;
    background: #1c2229;
    border: 1px solid #2e3843;
    border-radius: 5px;
    color: #dbe5ef;
    padding: 6px 9px;
    font-size: 11.5px;
    line-height: 1.5;
    white-space: pre;
    box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">SNOOP</div>
    <div class="brand-sub" id="brandSub"></div>
    <div class="refresh" id="refreshBox" hidden>
      <button type="button" id="refreshBtn">Refresh</button>
      <div class="status" id="refreshStatus"></div>
      <a class="settings-link" href="/settings">Settings</a>
    </div>

    <div id="teamControls" hidden>
      <div class="group">
        <h4>Teams:</h4>
        <div id="teamLinks"></div>
      </div>
    </div>
    <div id="statsControls" hidden>
      <div class="group">
        <h4>Forecast from:</h4>
        <div id="velocityWindow"></div>
      </div>
    </div>

    <div id="activityControls">
    <div class="group">
      <h4>Legend:</h4>
      <div id="legend"></div>
    </div>

    <div class="group">
      <h4>View by:</h4>
      <label class="opt"><input type="radio" name="viewby" value="user" checked> User</label>
      <label class="opt"><input type="radio" name="viewby" value="repo"> Repo</label>
    </div>

    <div class="group">
      <h4>Sort by:</h4>
      <label class="opt"><input type="radio" name="sortby" value="name" checked> Name</label>
      <label class="opt"><input type="radio" name="sortby" value="asc"> Low to high activity</label>
      <label class="opt"><input type="radio" name="sortby" value="desc"> High to low activity</label>
    </div>

    <div class="group">
      <h4>Custom:</h4>
      <label class="opt"><input type="checkbox" id="sizeToggle" checked> Size</label>
      <label class="opt"><input type="checkbox" id="hideEmpty"> Hide inactive rows</label>
    </div>
    </div>

    <div class="group">
      <h4>Snapshot:</h4>
      <div class="meta" id="metaBox"></div>
    </div>
  </aside>

  <main class="main">
    <nav class="tabs">
      <button type="button" data-view="activity" class="on">Activity</button>
      <button type="button" data-view="teams">Teams</button>
      <button type="button" data-view="people">People</button>
    </nav>
    <div id="banner"></div>
    <section id="activityView">
      <div class="grid" id="grid"></div>
      <div class="summary">
        <h3>TOTALS FOR THE WINDOW</h3>
        <div id="summary"></div>
      </div>
      <div class="unmatched" id="unmatchedBox"></div>
    </section>
    <section id="teamsView" class="teams" hidden></section>
    <section id="peopleView" class="teams" hidden></section>
  </main>
</div>

<script>
const DATA = __SNOOP_DATA__;

const TYPES = [
  { key: 'commit',  label: 'Code commit',    unit: 'files' },
  { key: 'merge',   label: 'Merge commit',   unit: 'files' },
  { key: 'pr',      label: 'PR activity',    unit: '' },
  { key: 'comment', label: 'PR comment',     unit: 'chars' },
  { key: 'ticket',  label: 'Ticket activity', unit: 'fields' }
];

const state = {
  types:   new Set(TYPES.map(t => t.key)),
  viewBy:  'user',
  sortBy:  'name',
  size:    true,
  hideEmpty: false
};

const peopleById = new Map(DATA.people.map(p => [p.id, p]));

/* A pill's width encodes how big the event was. Tickets stay as dots, which is
   what Flow did - a field change has no meaningful "size". */
function pillWidth(type, weight) {
  if (!state.size || type === 'ticket') return null;
  const w = weight || 0;
  if (type === 'comment') {
    if (w <= 40)  return 9;
    if (w <= 120) return 15;
    if (w <= 350) return 24;
    return 34;
  }
  if (w <= 2)   return 9;
  if (w <= 8)   return 15;
  if (w <= 25)  return 24;
  if (w <= 80)  return 34;
  return 46;
}

function groupKeyOf(evt) {
  if (state.viewBy === 'repo') return evt.r;
  return evt.p;
}

function groupLabelOf(key) {
  if (state.viewBy === 'repo') return key;
  const person = peopleById.get(key);
  return person ? person.name : 'Unknown';
}

/* Build: groupKey -> { total, byType, days: Map(dayKey -> Map(type -> events[])) } */
function buildGroups() {
  const groups = new Map();

  const ensure = key => {
    if (!groups.has(key)) {
      groups.set(key, { key, label: groupLabelOf(key), total: 0, byType: {}, weight: {}, days: new Map() });
    }
    return groups.get(key);
  };

  // Seed every roster member so inactive people still get a row.
  if (state.viewBy === 'user') {
    DATA.people.forEach(p => ensure(p.id));
  } else {
    DATA.meta.repos.forEach(r => ensure(r));
  }

  for (const evt of DATA.events) {
    if (state.viewBy === 'user' && evt.p < 0) continue;   // unattributed
    if (!state.types.has(evt.t)) continue;

    const group = ensure(groupKeyOf(evt));
    group.total++;
    group.byType[evt.t] = (group.byType[evt.t] || 0) + 1;
    group.weight[evt.t] = (group.weight[evt.t] || 0) + (evt.w || 0);

    if (!group.days.has(evt.d)) group.days.set(evt.d, new Map());
    const day = group.days.get(evt.d);
    if (!day.has(evt.t)) day.set(evt.t, []);
    day.get(evt.t).push(evt);
  }

  let rows = [...groups.values()];
  if (state.hideEmpty) rows = rows.filter(g => g.total > 0);

  if (state.sortBy === 'name')      rows.sort((a, b) => String(a.label).localeCompare(String(b.label)));
  else if (state.sortBy === 'asc')  rows.sort((a, b) => a.total - b.total || String(a.label).localeCompare(String(b.label)));
  else                              rows.sort((a, b) => b.total - a.total || String(a.label).localeCompare(String(b.label)));

  return rows;
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls)  node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateColumns = `210px repeat(${DATA.days.length}, 118px)`;

  // Header row
  grid.appendChild(el('div', 'cell head corner'));
  for (const day of DATA.days) {
    let cls = 'cell head';
    if (day.label === 'TODAY') cls += ' today';
    if (day.weekend) cls += ' weekend';
    grid.appendChild(el('div', cls, day.label));
  }

  const rows = buildGroups();
  const activeTypes = TYPES.filter(t => state.types.has(t.key));

  if (!rows.length) {
    const msg = el('div', 'empty-state', 'Nothing to show. Try enabling more activity types.');
    msg.style.gridColumn = '1 / -1';
    grid.appendChild(msg);
    return;
  }

  const rowBandSets = [];

  for (const row of rows) {
    const label = el('div', 'cell rowlabel' + (row.total === 0 ? ' empty' : ''));
    label.appendChild(el('div', 'name', row.label));
    label.appendChild(el('div', 'tot',
      row.total === 0 ? 'no activity' : row.total + (row.total === 1 ? ' event' : ' events')));
    label.title = row.label;
    grid.appendChild(label);

    // One bucket per activity type, collecting that band across every day cell.
    const bandsByType = activeTypes.map(() => []);

    for (const day of DATA.days) {
      const cell = el('div', 'cell daycell' + (day.weekend ? ' weekend' : ''));
      const dayData = row.days.get(day.key);

      activeTypes.forEach((type, i) => {
        const band = el('div', 'band');
        const events = dayData ? dayData.get(type.key) : null;
        if (events) {
          for (const evt of events) {
            const pill = el('div', 'pill ' + type.key + (type.key === 'ticket' ? ' dot' : ''));
            const width = pillWidth(type.key, evt.w);
            pill.style.width = width == null ? (type.key === 'ticket' ? '' : '13px') : width + 'px';
            pill.title = `${type.label} - ${day.key}\n${evt.x}`;
            band.appendChild(pill);
          }
        }
        bandsByType[i].push(band);
        cell.appendChild(band);
      });
      grid.appendChild(cell);
    }
    rowBandSets.push(bandsByType);
  }

  // Flow keeps each activity type on its own horizontal line across the whole
  // row. Wrapping makes every cell a different height, so pin each band to the
  // tallest one in its row after layout.
  for (const bandsByType of rowBandSets) {
    for (const bands of bandsByType) {
      let tallest = 0;
      for (const band of bands) tallest = Math.max(tallest, band.scrollHeight);
      for (const band of bands) band.style.height = tallest + 'px';
    }
  }
}

function renderLegend() {
  const box = document.getElementById('legend');
  box.innerHTML = '';

  const counts = {};
  for (const evt of DATA.events) counts[evt.t] = (counts[evt.t] || 0) + 1;

  for (const type of TYPES) {
    const label = el('label', 'opt');

    const box1 = document.createElement('input');
    box1.type = 'checkbox';
    box1.checked = state.types.has(type.key);
    box1.addEventListener('change', () => {
      box1.checked ? state.types.add(type.key) : state.types.delete(type.key);

/* ===========================================================================
   Teams view

   Velocity, open work and a finish forecast per team, from DATA.stats - a much
   longer window than the grid (stats.monthsBack in the config). The arithmetic
   lives here rather than in the script so the forecast window can be changed
   without a re-run.
   =========================================================================== */

const STATS  = DATA.stats;
const DAY_MS = 86400000;
const SVG_NS = 'http://www.w3.org/2000/svg';

const PR_STATES = [
  { key: 'completed', label: 'Completed' },
  { key: 'abandoned', label: 'Abandoned' },
  { key: 'active',    label: 'Active' },
  { key: 'draft',     label: 'Draft' }
];

const teamState = { velocitySprints: STATS ? STATS.velocitySprints : 6, selected: 'overview' };

const toDate   = s => new Date(s + 'T00:00:00Z');
const shortDay = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
const longDay  = d => d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
const sum      = (xs, f = x => x) => xs.reduce((total, x) => total + f(x), 0);
const mean     = xs => xs.length ? sum(xs) / xs.length : 0;
const fmt      = n => n == null || !isFinite(n) ? '-' : (Math.round(n * 10) / 10).toLocaleString();
const fmtTick  = v => v >= 1000 ? (v / 1000) + 'K' : String(Math.round(v * 10) / 10);
const plural   = (n, word) => `${fmt(n)} ${n === 1 ? word : word.replace(/y$/, 'ie') + 's'}`;

function weekdaysBetween(from, to) {
  let n = 0;
  for (let t = from.getTime(); t < to.getTime(); t += DAY_MS) {
    const dow = new Date(t).getUTCDay();
    if (dow !== 0 && dow !== 6) n++;
  }
  return n;
}

/* Sprints are fixed-length periods. With stats.sprintAnchorDate they line up
   with the team's real sprints and the one in progress is kept out of the
   average, since a half-finished sprint drags it down. Without an anchor they
   are rolling periods ending today, so the newest one is always complete. */
function buildSprints() {
  const len  = STATS.sprintDays * DAY_MS;
  const end  = toDate(STATS.to).getTime() + DAY_MS;
  const from = toDate(STATS.from).getTime();

  let edge = end;
  if (STATS.anchor) {
    const anchor = toDate(STATS.anchor).getTime();
    edge = anchor + Math.floor((end - anchor) / len) * len;
  }

  const make = (start, complete) => {
    const s = new Date(start), e = new Date(start + len);
    return { from: s, to: e, last: new Date(start + len - DAY_MS), workdays: weekdaysBetween(s, e), complete };
  };
  const sprints = [];
  for (let e = edge; e - len >= from; e -= len) sprints.unshift(make(e - len, true));
  if (edge < end) sprints.push(make(edge, false));
  return sprints;
}

const SPRINTS = STATS ? buildSprints() : [];
const TODAY   = STATS ? toDate(STATS.to) : null;
const SPRINT_WORKDAYS = (SPRINTS.find(s => s.complete) ||
                         { workdays: Math.round((STATS ? STATS.sprintDays : 14) * 5 / 7) }).workdays;

if (STATS) {
  for (const item of STATS.items) {
    const t = item.c ? toDate(item.c).getTime() : null;
    item.si = t == null ? -1 : SPRINTS.findIndex(s => t >= s.from.getTime() && t < s.to.getTime());
  }
}

/* The complete sprints the forecast averages. Sprints before `first` - the
   first one with anything closed - are left out: a team or person that only
   started recently would otherwise look slow for months of nothing. */
function recentSprints(first = 0) {
  const complete = SPRINTS.map((s, i) => i).filter(i => SPRINTS[i].complete);
  const live     = first > 0 ? complete.filter(i => i >= first) : complete;
  const pool     = live.length ? live : complete;
  return teamState.velocitySprints > 0 ? pool.slice(-teamState.velocitySprints) : pool;
}

/* The range comes from the slower and faster halves of the recent sprints -
   easier to explain than a standard deviation, and it never goes negative. */
function forecast(values, remaining) {
  const sorted = [...values].sort((a, b) => a - b);
  const half   = Math.ceil(sorted.length / 2);
  const rates  = {
    avg:  mean(sorted),
    low:  mean(sorted.slice(0, half)),
    high: mean(sorted.slice(sorted.length - half))
  };
  const out = { remaining, rates };
  for (const key of Object.keys(rates)) {
    const sprints = remaining <= 0 ? 0 : rates[key] > 0 ? remaining / rates[key] : Infinity;
    out[key] = {
      sprints,
      workdays: sprints * SPRINT_WORKDAYS,
      date: isFinite(sprints) ? new Date(TODAY.getTime() + sprints * STATS.sprintDays * DAY_MS) : null
    };
  }
  return out;
}

const ITEMS_BY_ID = new Map(STATS ? STATS.items.map(i => [i.id, i]) : []);

const KINDS = [
  { key: 'story', label: 'Stories' },
  { key: 'bug',   label: 'Bugs' },
  { key: 'task',  label: 'Tasks' }
];

/* Where a work item stands. "handoff" is work out of the developers' hands -
   in Test with QA, say (stats.handedOffStates). It isn't work left, so it stays
   out of the estimates, and it isn't done until it closes. */
const HANDED_OFF = new Set(((STATS && STATS.handedOffStates) || []).map(s => s.toLowerCase()));
const PHASE_RANK = { notStarted: 0, dev: 1, handoff: 2, done: 3 };
function phaseOf(item) {
  if (item.g === 'Completed') return 'done';
  if (HANDED_OFF.has((item.s || '').toLowerCase())) return 'handoff';
  if (item.g === 'Proposed') return 'notStarted';
  return 'dev';
}
const isWorkLeft = item => PHASE_RANK[phaseOf(item)] < PHASE_RANK.handoff;
const handedOffNames = items => [...new Set(items.map(i => i.s))].join(' / ');
const devStateNames = (items = STATS.items) => STATES
  .filter(s => (s.phase === 'notStarted' || s.phase === 'dev') && items.some(i => i.s === s.name))
  .map(s => s.name).join(', ');

/* Every state, in workflow order (stats.stateOrder). A state that isn't listed
   goes after the last listed one at the same stage. Colours come in a family
   per phase, so "not started", "in development", "with QA" and "done" read at
   a glance, and a state keeps its colour everywhere. */
const PHASE_FAMILIES = {
  notStarted: ['#8a97a6', '#b4bfcb', '#5b6b7c'],
  dev:        ['#3987e5', '#5bc0eb', '#a78bfa', '#d95926', '#e879b9'],
  handoff:    ['#c98500', '#2bb3a3', '#7ad3c8'],
  done:       ['#4ade80', '#199e70', '#9be7b4']
};
const STATES = (() => {
  if (!STATS) return [];
  const adoOrder = (STATS.states || []).map(s => s.n.toLowerCase());
  const workflow = (STATS.stateOrder || []).map(s => s.toLowerCase());
  const seen = new Map();
  for (const item of STATS.items) {
    if (seen.has(item.s)) continue;
    const name = (item.s || '').toLowerCase();
    const pos = adoOrder.indexOf(name);
    seen.set(item.s, { name: item.s, g: item.g, phase: phaseOf(item), at: workflow.indexOf(name), pos: pos < 0 ? 999 : pos });
  }
  const rank = s => PHASE_RANK[s.phase];
  const list = [...seen.values()].filter(s => s.at >= 0).sort((a, b) => a.at - b.at);
  const unlisted = [...seen.values()].filter(s => s.at < 0)
    .sort((a, b) => rank(a) - rank(b) || a.pos - b.pos || a.name.localeCompare(b.name));
  for (const state of unlisted) {
    let after = -1;
    list.forEach((s, i) => { if (rank(s) <= rank(state)) after = i; });
    list.splice(after + 1, 0, state);
  }
  const used = {};
  for (const state of list) {
    const family = PHASE_FAMILIES[state.phase];
    const n = used[state.phase] = (used[state.phase] || 0) + 1;
    state.color = family[(n - 1) % family.length];
  }
  return list;
})();

/* When each person was first and last seen doing anything: opening or closing
   a PR, closing a story, bug or task, or anything on the Activity grid. */
const ACTIVITY = new Map();
/* Finished work with a date - a completed PR or a closed item - for comparing
   someone's output with everyone else's over the same stretch. */
const WORK_EVENTS = [];
(() => {
  const touch = (p, d) => {
    if (p == null || p < 0 || !d) return;
    const a = ACTIVITY.get(p);
    if (!a) ACTIVITY.set(p, { first: d, last: d });
    else { if (d < a.first) a.first = d; if (d > a.last) a.last = d; }
  };
  if (STATS) {
    for (const pr of STATS.prs) {
      touch(pr.p, pr.c);
      if (pr.s === 'completed' || pr.s === 'abandoned') touch(pr.p, pr.x);
      if (pr.s === 'completed' && pr.x) WORK_EVENTS.push({ p: pr.p, d: pr.x });
    }
    for (const item of STATS.items) {
      if (!item.c) continue;
      touch(item.p, item.c);
      if (item.p >= 0) WORK_EVENTS.push({ p: item.p, d: item.c });
    }
  }
  for (const evt of DATA.events) touch(evt.p, evt.d);
})();

/* "SCH - Story", "SCH: Story", "[SCH] Story" - but not "SCHEMA story". */
function hasTitlePrefix(title, prefix) {
  const t = (title || '').trimStart().toLowerCase();
  if (t.startsWith('[' + prefix + ']')) return true;
  if (!t.startsWith(prefix)) return false;
  return !/[a-z0-9]/.test(t.charAt(prefix.length));
}

function teamModel(team) {
  const repos    = new Set(team.repos.map(r => r.toLowerCase()));
  const areas    = team.areaPaths.map(a => a.toLowerCase());
  const prefixes = (team.titlePrefixes || []).map(p => p.toLowerCase());
  const underArea = item => {
    const path = (item.a || '').toLowerCase();
    return areas.some(a => path === a || path.startsWith(a + '\\'));
  };
  const titled = item => prefixes.some(p => hasTitlePrefix(item.t, p));
  // A task or bug rarely carries the prefix itself, so it goes with its story.
  const owns = item => {
    if (underArea(item) || titled(item)) return true;
    const parent = item.k !== 'story' && item.par != null ? ITEMS_BY_ID.get(item.par) : null;
    return !!parent && titled(parent);
  };
  // Area paths or title prefixes mark out the team's own backlog; without
  // either, the best guess is whatever its members are assigned.
  const scoped = areas.length > 0 || prefixes.length > 0;

  const prs = STATS.prs.filter(pr => repos.has(pr.r.toLowerCase()));

  // Members as configured, else anyone with a PR in the team's repos (or a
  // story in its backlog).
  let memberIds = team.members;
  if (!memberIds) {
    const found = new Set(prs.map(pr => pr.p));
    if (scoped) for (const item of STATS.items) if (item.p >= 0 && owns(item)) found.add(item.p);
    memberIds = [...found];
  }
  const members = new Set(memberIds);

  const items = STATS.items.filter(item => scoped ? owns(item) : members.has(item.p));
  const scope = workScope(prs, items);
  const { done, open, unit, avgSize, openValue, velocity } = scope;

  const first     = velocity.findIndex(v => v > 0);
  const recent    = recentSprints(first);
  const remaining = sum(open, openValue);
  const fc        = forecast(recent.map(i => velocity[i]), remaining);
  const people    = personRows(memberIds, scope, recent);

  return {
    team, unit, avgSize, openValue, prs, items, people, done, open, velocity, recent, remaining,
    // The charts start a sprint before the team first closed anything.
    chartFrom:     Math.max(0, first - 1),
    forecast:      fc,
    closedCount:   scope.closedCount,
    contributors:  people.filter(p => p.velocity > 0).length,
    openUnpointed: open.filter(i => i.pts == null).length,
    byPhase:       Object.fromEntries(['notStarted', 'dev'].map(p => [p, sum(open.filter(i => phaseOf(i) === p), openValue)])),
    handedOff:     scope.handedOff,
    taskHours:     sum(scope.openTasks, t => t.rem)
  };
}

/* What a set of PRs and work items adds up to. Only stories count towards
   velocity: bugs and tasks are counted as work done, never as points. */
function workScope(prs, items) {
  const stories   = items.filter(i => i.k === 'story');
  const done      = stories.filter(i => phaseOf(i) === 'done');
  // Open work is what's left for the developers: not started or in development.
  const open      = stories.filter(isWorkLeft);
  const handedOff = stories.filter(i => phaseOf(i) === 'handoff');

  // Points when the work is pointed, a plain story count when it isn't.
  // Open stories with no points count at the average story size.
  const pointedDone = done.filter(i => i.pts != null);
  const unit      = pointedDone.length ? 'pts' : 'stories';
  const avgSize   = pointedDone.length ? mean(pointedDone.map(i => i.pts)) : 1;
  const doneValue = i => unit === 'pts' ? (i.pts || 0) : 1;
  const openValue = i => unit === 'pts' ? (i.pts != null ? i.pts : avgSize) : 1;
  const bySprint  = list => SPRINTS.map((s, idx) => sum(list.filter(i => i.si === idx), doneValue));

  return {
    prs, items, stories, done, open, handedOff, unit, avgSize, openValue, bySprint,
    velocity:    bySprint(done),
    closedCount: SPRINTS.map((s, idx) => done.filter(i => i.si === idx).length),
    closedBugs:  items.filter(i => i.k === 'bug' && phaseOf(i) === 'done'),
    closedTasks: items.filter(i => i.k === 'task' && phaseOf(i) === 'done'),
    openTasks:   items.filter(i => i.k === 'task' && isWorkLeft(i) && i.rem != null)
  };
}

const workTotal = w => w.prs + w.stories + w.bugs + w.tasks;
const byWorkDone = (a, b) => b.workDone - a.workDone || b.points - a.points || a.name.localeCompare(b.name);

/* One row per person, busiest first. "Work done" is everything they finished:
   completed PRs plus closed stories, bugs and tasks. */
function personRows(ids, scope, recent) {
  const { prs, done, open, closedBugs, closedTasks, openTasks, openValue, bySprint } = scope;
  return ids.map(id => {
    const myPrs     = prs.filter(pr => pr.p === id);
    const myDone    = done.filter(i => i.p === id);
    const myOpen    = open.filter(i => i.p === id);
    const myPointed = myDone.filter(i => i.pts != null);
    const mySprints = bySprint(myDone);
    const act       = activityOf(id);
    // Someone who joined last month is averaged over the sprints they were here for.
    const myRecent  = act ? recent.filter(i => SPRINTS[i].to.getTime() > act.since.getTime()) : recent;
    const velocity  = mean(myRecent.map(i => mySprints[i]));
    const remaining = sum(myOpen, openValue);
    const prCounts  = Object.fromEntries(PR_STATES.map(s => [s.key, myPrs.filter(pr => pr.s === s.key).length]));
    const work = {
      prs:     prCounts.completed,
      stories: myDone.length,
      bugs:    closedBugs.filter(i => i.p === id).length,
      tasks:   closedTasks.filter(i => i.p === id).length
    };
    return {
      id,
      name:      (peopleById.get(id) || { name: 'Unknown' }).name,
      prs:       prCounts,
      prTotal:   myPrs.length,
      done:      myDone.length,
      points:    sum(myPointed, i => i.pts),
      avgPoints: myPointed.length ? mean(myPointed.map(i => i.pts)) : null,
      sprints:   mySprints,
      velocity,
      open:      myOpen.length,
      remaining,
      workdays:  remaining <= 0 ? 0 : velocity > 0 ? remaining / velocity * SPRINT_WORKDAYS : Infinity,
      taskHours: sum(openTasks.filter(t => t.p === id), t => t.rem),
      work,
      workDone:  workTotal(work),
      act
    };
  }).sort(byWorkDone);
}

/* A person's stretch of activity, clipped to the stats window - before it
   Snoop has no record of anyone, so it can't compare. */
function activityOf(id) {
  const a = ACTIVITY.get(id);
  if (!a) return null;
  const windowStart = toDate(STATS.from);
  const first = toDate(a.first), last = toDate(a.last);
  const since = first < windowStart ? windowStart : first;
  const until = last < since ? since : last;
  return {
    since, until,
    // Active in the window's first week: they were very likely here before it.
    early: since.getTime() - windowStart.getTime() < 7 * DAY_MS,
    days:  Math.round((until - since) / DAY_MS) + 1,
    workdays: Math.max(1, weekdaysBetween(since, new Date(until.getTime() + DAY_MS)))
  };
}

/* What share of everyone's finished work over the same stretch was theirs. */
function shareWhileActive(id, act) {
  if (!act) return null;
  const from = act.since.toISOString().slice(0, 10), to = act.until.toISOString().slice(0, 10);
  let mine = 0, all = 0;
  for (const e of WORK_EVENTS) {
    if (e.d < from || e.d > to) continue;
    all++;
    if (e.p === id) mine++;
  }
  return all ? mine / all : null;
}

/* ---------- chart pieces ---------- */

function svg(tag, attrs, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (text != null) node.textContent = text;
  return node;
}

function niceScale(max, count = 4) {
  if (!(max > 0)) return { top: count, step: 1 };
  const raw  = max / count;
  const mag  = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  return { top: Math.ceil(max / step) * step, step };
}

function yAxis(root, scale, y, left, right) {
  for (let v = 0; v <= scale.top + 1e-9; v += scale.step) {
    const py = y(v);
    root.appendChild(svg('line', { x1: left, x2: right, y1: py, y2: py, class: v === 0 ? 'baseline' : 'grid-line' }));
    root.appendChild(svg('text', { x: left - 6, y: py + 3.5, 'text-anchor': 'end' }, fmtTick(v)));
  }
}

/* A column with a 4px rounded cap and a square foot on the baseline. */
function columnPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function chartBox(title, sub, legend) {
  const box = el('div', 'chart');
  box.appendChild(el('h4', null, title));
  box.appendChild(el('div', 'sub', sub));
  if (legend) {
    const row = el('div', 'legend-row');
    for (const item of legend) {
      const span = el('span');
      const key = el('i', 'key' + (item.line ? ' line' : '') + (item.wash ? ' wash' : ''));
      key.style.background = item.color;
      if (item.opacity) key.style.opacity = item.opacity;
      span.appendChild(key);
      span.appendChild(document.createTextNode(item.label));
      row.appendChild(span);
    }
    box.appendChild(row);
  }
  return box;
}

const CHART = { W: 580, H: 230, l: 38, r: 52, t: 16, b: 26 };

function velocityChart(model) {
  const { W, H } = CHART;
  const plotW = W - CHART.l - CHART.r, plotH = H - CHART.t - CHART.b;
  const recent = new Set(model.recent);
  const avg    = model.forecast.rates.avg;
  const from   = model.chartFrom || 0;
  const shown  = SPRINTS.slice(from);
  const scale  = niceScale(Math.max(...model.velocity.slice(from), avg, 1));
  const y      = v => CHART.t + plotH - (v / scale.top) * plotH;

  const box = chartBox(`Velocity (${model.unit} closed per sprint)`,
    `${STATS.sprintDays}-day sprints` + (from > 0 ? ', from the sprint before the first story was closed' : '') +
    '. Solid columns feed the forecast; faded ones are older' +
    (SPRINTS.some(s => !s.complete) ? ', and the palest is the sprint in progress.' : '.'));
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}` });
  yAxis(root, scale, y, CHART.l, W - CHART.r);

  const band       = plotW / Math.max(shown.length, 1);
  const barW       = Math.min(24, band * 0.62);
  const labelEvery = Math.ceil(46 / band);

  shown.forEach((s, j) => {
    const i  = from + j;
    const x0 = CHART.l + j * band;
    const v  = model.velocity[i];
    const tip = `${shortDay(s.from)} - ${shortDay(s.last)}${s.complete ? '' : ' (in progress)'}\n` +
                `${fmt(v)} ${model.unit} - ${plural(model.closedCount[i], 'story')} closed` +
                (recent.has(i) ? '\nUsed in the forecast' : '');
    const g = svg('g', { class: 'hit', 'data-tip': tip });
    g.appendChild(svg('rect', { x: x0, y: CHART.t, width: band, height: plotH }));
    if (v > 0) {
      g.appendChild(svg('path', {
        d: columnPath(x0 + (band - barW) / 2, y(v), barW, y(0) - y(v)),
        fill: 'var(--series)',
        'fill-opacity': !s.complete ? 0.28 : recent.has(i) ? 1 : 0.45
      }));
    }
    root.appendChild(g);
    if ((shown.length - 1 - j) % labelEvery === 0) {
      root.appendChild(svg('text', { x: x0 + band / 2, y: H - 8, 'text-anchor': 'middle' },
        s.complete ? shortDay(s.from) : 'now'));
    }
  });

  if (model.recent.length && avg > 0) {
    const x1 = CHART.l + (model.recent[0] - from) * band;
    const x2 = CHART.l + (model.recent[model.recent.length - 1] - from + 1) * band;
    root.appendChild(svg('line', { x1, x2, y1: y(avg), y2: y(avg), stroke: 'var(--text)', 'stroke-width': 1, 'pointer-events': 'none' }));
    // Labelled in the right margin, where no column can sit on it.
    root.appendChild(svg('line', { x1: x2, x2: W - CHART.r + 4, y1: y(avg), y2: y(avg), stroke: 'var(--text)', 'stroke-width': 1, 'stroke-opacity': 0.35 }));
    root.appendChild(svg('text', { x: W - CHART.r + 7, y: y(avg) + 3.5, fill: 'var(--text)' }, `avg ${fmt(avg)}`));
  }

  box.appendChild(root);
  return box;
}

/* Burn-up: what has been closed so far, against a flat line for everything
   closed plus everything still open today, with the forecast running forward
   from today at the average velocity and inside the slow-fast range. */
function burnupChart(model) {
  const { W, H } = CHART;
  const plotW = W - CHART.l - CHART.r, plotH = H - CHART.t - CHART.b;
  const fc    = model.forecast;
  const len   = STATS.sprintDays * DAY_MS;
  const now   = TODAY.getTime() + DAY_MS;
  const from  = model.chartFrom || 0;
  const start = SPRINTS.length ? SPRINTS[from].from.getTime() : TODAY.getTime();

  let running = sum(model.velocity.slice(0, from));
  const history = [{ t: start, v: running }];
  SPRINTS.slice(from).forEach((s, j) => {
    running += model.velocity[from + j];
    history.push({ t: Math.min(s.to.getTime(), now), v: running, s });
  });
  const doneNow = running;
  const scope   = doneNow + fc.remaining;

  // Run the chart out to the slow-case finish, within reason.
  const maxFuture = 26;
  const slow      = isFinite(fc.low.sprints) ? fc.low.sprints : maxFuture;
  const end       = now + Math.max(1, Math.min(maxFuture, Math.ceil(slow))) * len;

  const scale = niceScale(Math.max(scope, 1));
  const x = t => CHART.l + (t - start) / (end - start) * plotW;
  const y = v => CHART.t + plotH - (v / scale.top) * plotH;
  const at   = rate => t => rate > 0 ? Math.min(scope, doneNow + rate * (t - now) / len) : doneNow;
  const hits = rate => rate > 0 ? now + (scope - doneNow) / rate * len : Infinity;

  const box = chartBox(`Burn-up and forecast (${model.unit})`,
    'Scope is what is closed plus the work left today (not stories with QA) - work added later will push the finish out.',
    [
      { label: 'Closed', color: 'var(--series)', line: true },
      { label: 'Forecast at average velocity', color: 'var(--series)', line: true, opacity: 0.5 },
      { label: 'Slow to fast range', color: 'var(--series)', wash: true },
      { label: 'Scope today', color: 'var(--dim)', line: true }
    ]);
  const root = svg('svg', { viewBox: `0 0 ${W} ${H}` });
  yAxis(root, scale, y, CHART.l, W - CHART.r);

  // Hover strips, one per sprint past and future, each reading out its end.
  const strips = [...history.slice(1).map(h => ({ t: h.t, past: true, v: h.v, s: h.s }))];
  for (let t = now + len; t <= end + 1; t += len) strips.push({ t, past: false });
  strips.forEach((strip, i) => {
    const left = i === 0 ? start : strips[i - 1].t;
    const tip = strip.past
      ? `${shortDay(strip.s.from)} - ${shortDay(new Date(strip.t - DAY_MS))}\n${fmt(strip.v)} ${model.unit} closed since ${shortDay(new Date(start))}`
      : `By ${longDay(new Date(strip.t))} (forecast)\n` +
        `${fmt(at(fc.rates.avg)(strip.t))} of ${fmt(scope)} ${model.unit} at average velocity\n` +
        `range ${fmt(at(fc.rates.low)(strip.t))} - ${fmt(at(fc.rates.high)(strip.t))}`;
    const g = svg('g', { class: 'hit', 'data-tip': tip });
    g.appendChild(svg('rect', { x: x(left), y: CHART.t, width: Math.max(0, x(strip.t) - x(left)), height: plotH }));
    g.appendChild(svg('line', { class: 'xhair', x1: x(strip.t), x2: x(strip.t), y1: CHART.t, y2: CHART.t + plotH }));
    root.appendChild(g);
  });

  const noHit = { 'pointer-events': 'none' };

  // Scope and today.
  root.appendChild(svg('line', { x1: CHART.l, x2: W - CHART.r, y1: y(scope), y2: y(scope), stroke: 'var(--dim)', 'stroke-width': 1, ...noHit }));
  root.appendChild(svg('text', { x: CHART.l + 4, y: y(scope) - 5, ...noHit }, `scope ${fmt(scope)}`));
  root.appendChild(svg('line', { x1: x(now), x2: x(now), y1: CHART.t, y2: CHART.t + plotH, class: 'grid-line', ...noHit }));
  root.appendChild(svg('text', { x: x(now), y: CHART.t - 4, 'text-anchor': 'middle', ...noHit }, 'today'));

  // Forecast range and line.
  if (fc.remaining > 0 && fc.rates.high > 0) {
    const hi = at(fc.rates.high), lo = at(fc.rates.low);
    const hHi = Math.min(hits(fc.rates.high), end), hLo = Math.min(hits(fc.rates.low), end);
    const poly = [[now, doneNow], [hHi, hi(hHi)], [end, hi(end)], [end, lo(end)], [hLo, lo(hLo)]]
      .map(([t, v]) => `${x(t)},${y(v)}`).join(' ');
    root.appendChild(svg('polygon', { points: poly, fill: 'var(--series)', 'fill-opacity': 0.12, ...noHit }));

    const avgAt = at(fc.rates.avg), hAvg = Math.min(hits(fc.rates.avg), end);
    root.appendChild(svg('line', {
      x1: x(now), y1: y(doneNow), x2: x(hAvg), y2: y(avgAt(hAvg)),
      stroke: 'var(--series)', 'stroke-opacity': 0.5, 'stroke-width': 2, 'stroke-linecap': 'round', ...noHit
    }));
    if (fc.avg.date && hits(fc.rates.avg) <= end) {
      root.appendChild(svg('circle', { cx: x(hAvg), cy: y(scope), r: 4.5, fill: 'var(--series)', stroke: 'var(--panel)', 'stroke-width': 2, ...noHit }));
      // Above the scope line: the forecast line arrives from below.
      root.appendChild(svg('text', {
        x: x(hAvg), y: y(scope) - 9, 'text-anchor': 'middle', fill: '#e6edf5', ...noHit
      }, `~${shortDay(fc.avg.date)}`));
    }
  }

  // What has actually been closed.
  root.appendChild(svg('polyline', {
    points: history.map(h => `${x(h.t)},${y(h.v)}`).join(' '),
    fill: 'none', stroke: 'var(--series)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...noHit
  }));
  root.appendChild(svg('circle', { cx: x(now), cy: y(doneNow), r: 4.5, fill: 'var(--series)', stroke: 'var(--panel)', 'stroke-width': 2, ...noHit }));

  // Date ticks.
  for (let i = 0; i <= 4; i++) {
    const t = start + (end - start) * i / 4;
    root.appendChild(svg('text', {
      x: x(t), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle'
    }, shortDay(new Date(t))));
  }

  box.appendChild(root);
  return box;
}

function sparkline(values, max) {
  const W = 84, H = 22, pad = 4;
  const root = svg('svg', { class: 'spark', width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  if (values.length < 2) return root;
  const x = i => pad + i * (W - 2 * pad) / (values.length - 1);
  const y = v => H - pad - (max > 0 ? v / max : 0) * (H - 2 * pad);
  root.appendChild(svg('line', { x1: pad, x2: W - pad, y1: H - pad, y2: H - pad, class: 'grid-line' }));
  root.appendChild(svg('polyline', {
    points: values.map((v, i) => `${x(i)},${y(v)}`).join(' '),
    fill: 'none', stroke: 'var(--series)', 'stroke-width': 1.5, 'stroke-linejoin': 'round'
  }));
  const last = values.length - 1;
  root.appendChild(svg('circle', { cx: x(last), cy: y(values[last]), r: 3, fill: 'var(--series)', stroke: 'var(--bg)', 'stroke-width': 1.5 }));
  return root;
}

/* ---------- team sections ---------- */

/* A link that opens exactly these work items as an unsaved query in Azure
   DevOps. The ids go in the URL, so a very large set is cut to the newest that
   fit - Azure DevOps turns away URLs much over 8 KB. */
const ADO_URL_BUDGET = 7000;
function adoQuery(items) {
  if (!STATS.wiOrg || !(STATS.wiProjects || []).length || !items.length) return null;
  // The query runs from one project; most items will share it.
  const byProject = new Map();
  for (const i of items) byProject.set(i.pj || 0, (byProject.get(i.pj || 0) || 0) + 1);
  const pj = [...byProject].sort((a, b) => b[1] - a[1])[0][0];
  const project = STATS.wiProjects[pj] || STATS.wiProjects[0];

  const base = `https://dev.azure.com/${encodeURIComponent(STATS.wiOrg)}/${encodeURIComponent(project)}/_queries/query/?wiql=`;
  const head = 'SELECT [System.Id], [System.WorkItemType], [System.Title], [System.State], [System.AssignedTo] ' +
               'FROM WorkItems WHERE [System.Id] IN (';
  const tail = ') ORDER BY [System.Id] DESC';
  let length = base.length + encodeURIComponent(head + tail).length;
  const ids = [];
  for (const id of items.map(i => i.id).sort((a, b) => b - a)) {
    length += encodeURIComponent((ids.length ? ',' : '') + id).length;
    if (length > ADO_URL_BUDGET) break;
    ids.push(id);
  }
  return {
    url: base + encodeURIComponent(head + ids.join(',') + tail),
    note: ids.length < items.length
      ? `Click to open the newest ${ids.length} of these in Azure DevOps (the link can't hold all ${items.length})`
      : 'Click to open these in Azure DevOps'
  };
}

function linkTo(query, cls, text) {
  if (!query) return el('div', cls, text);
  const a = el('a', cls, text);
  a.href = query.url;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

/* One 100% bar per kind - stories, bugs, tasks - split by state. */
function breakdownChart(items, sub) {
  const present = STATES.filter(s => items.some(i => i.s === s.name));
  const box = chartBox('Stories, bugs and tasks by state', sub + ' Click a segment or count to open those items in Azure DevOps.',
    present.map(s => ({ label: s.name, color: s.color })));
  box.classList.add('wide');

  for (const kind of KINDS) {
    const list = items.filter(i => i.k === kind.key);
    const row = el('div', 'brow');
    row.appendChild(el('div', 'blabel', kind.label));
    const all = adoQuery(list);
    const count = row.appendChild(linkTo(all, 'bcount', list.length));
    if (all) count.dataset.tip = `All ${list.length} ${kind.label.toLowerCase()}\n${all.note}`;
    const bar = el('div', 'bbar');
    const parts = [];
    for (const state of present) {
      const matching = list.filter(i => i.s === state.name);
      const n = matching.length;
      if (!n) continue;
      const pct = 100 * n / list.length;
      const pctText = pct < 1 ? '<1%' : Math.round(pct) + '%';
      const query = adoQuery(matching);
      const seg = linkTo(query, 'seg', pct >= 6 ? pctText : '');
      seg.style.flex = String(n);
      seg.style.background = state.color;
      seg.dataset.tip = `${kind.label} - ${state.name}: ${n} of ${list.length} (${pctText})` + (query ? `\n${query.note}` : '');
      bar.appendChild(seg);
      parts.push(`${state.name} ${n} (${pctText})`);
    }
    if (!list.length) bar.appendChild(el('span', 'caption', 'none'));
    row.appendChild(bar);
    if (parts.length) row.appendChild(el('div', 'caption', parts.join('  ·  ')));
    box.appendChild(row);
  }
  return box;
}

function tile(label, value, unit, sub, lead) {
  const box = el('div', 'tile' + (lead ? ' lead' : ''));
  box.appendChild(el('div', 'label', label));
  const v = el('div', 'value', value);
  if (unit) { v.appendChild(document.createTextNode(' ')); v.appendChild(el('small', null, unit)); }
  box.appendChild(v);
  if (sub) box.appendChild(el('div', 'sub', sub));
  return box;
}

function finishText(fc) {
  if (fc.remaining <= 0) return { value: 'Nothing open', sub: '' };
  if (!fc.avg.date) return { value: 'No forecast', sub: 'nothing closed in the forecast sprints' };
  const slow = fc.low.date ? longDay(fc.low.date) : 'never at the slow pace';
  return {
    value: longDay(fc.avg.date),
    sub: `~${fmt(Math.ceil(fc.avg.workdays))} working days from today (${fmt(fc.avg.sprints)} sprints)\n` +
         `range ${shortDay(fc.high.date)} - ${slow}`
  };
}

function renderTeamSection(model, index) {
  const { team, forecast: fc, unit } = model;
  const section = el('section', 'team');
  section.id = 'team-' + index;

  section.appendChild(el('h2', null, team.name));
  const sub = el('div', 'team-sub');
  for (const repo of team.repos) sub.appendChild(el('span', 'chip', repo));
  for (const area of team.areaPaths) sub.appendChild(el('span', 'chip', area));
  for (const prefix of team.titlePrefixes || []) sub.appendChild(el('span', 'chip', `"${prefix} - ..."`));
  sub.appendChild(document.createTextNode(` ${plural(model.people.length, 'member')}`));
  section.appendChild(sub);

  const k = model.recent.length;
  const tiles = el('div', 'tiles');
  tiles.appendChild(tile('Velocity', fmt(fc.rates.avg), `${unit} / sprint`,
    `last ${plural(k, 'sprint')} - slow ${fmt(fc.rates.low)}, fast ${fmt(fc.rates.high)}`));

  const unpointed = unit === 'pts' && model.openUnpointed
    ? `\n${model.openUnpointed} unpointed, counted at ~${fmt(model.avgSize)} pts each` : '';
  const qa = model.handedOff.length
    ? `\nNot counted: ${plural(model.handedOff.length, 'story')} (${fmt(sum(model.handedOff, model.openValue))} ${unit}) ` +
      `in ${handedOffNames(model.handedOff)}, with QA` : '';
  tiles.appendChild(tile('Open work', fmt(model.remaining), unit,
    `${plural(model.open.length, 'story')}: ${fmt(model.byPhase.notStarted)} not started, ` +
    `${fmt(model.byPhase.dev)} in development${unpointed}${qa}`));

  const finish = finishText(fc);
  tiles.appendChild(tile('Likely finish', finish.value, '', finish.sub, true));

  // Total effort, not calendar time: the team works these days side by side.
  const devDays = fc.avg.workdays * model.contributors;
  const people  = `${model.contributors} ${model.contributors === 1 ? 'person' : 'people'}`;
  tiles.appendChild(tile('Effort left', isFinite(devDays) && model.contributors ? fmt(Math.ceil(devDays)) : '-', 'person-days',
    isFinite(fc.avg.workdays) && fc.remaining > 0
      ? `~${fmt(Math.ceil(fc.avg.workdays))} working days × ${people} closing work.\nCombined effort, not calendar time - see Likely finish.`
      : `${people} closing work at the current pace`));

  if (model.taskHours > 0) {
    tiles.appendChild(tile('Task estimates', fmt(model.taskHours), 'h left',
      `~${fmt(Math.ceil(model.taskHours / STATS.hoursPerDay))} dev-days at ${STATS.hoursPerDay} h/day, from Remaining Work on open tasks`));
  }

  const prCount = s => model.prs.filter(pr => pr.s === s).length;
  tiles.appendChild(tile('Pull requests', fmt(prCount('active') + prCount('draft')), 'open',
    `${prCount('draft')} drafts - ${prCount('completed')} completed, ${prCount('abandoned')} abandoned since ${longDay(toDate(STATS.from))}`));
  section.appendChild(tiles);

  const charts = el('div', 'charts');
  charts.appendChild(velocityChart(model));
  charts.appendChild(burnupChart(model));
  charts.appendChild(breakdownChart(model.items,
    `Everything in this team's backlog: open now, plus closed since ${longDay(toDate(STATS.from))}, in workflow order. ` +
    `Only ${devStateNames() || 'not-started and in-development states'} count as work left. Hover a segment for its count.`));
  section.appendChild(charts);

  section.appendChild(el('h3', null, 'MEMBERS - MOST WORK DONE FIRST'));
  section.appendChild(prLegend());
  section.appendChild(personTable(model.people, unit, { from: model.chartFrom, daysToClear: true }));

  const note = el('p', 'note');
  note.innerHTML =
    `<b>How this is worked out.</b> Velocity is ${unit === 'pts' ? 'story points' : 'stories (nothing here is pointed)'} ` +
    `closed per ${STATS.sprintDays}-day sprint, averaged over the last ${plural(k, 'sprint')} since the team first closed a story; ` +
    `the range uses the slower and faster halves of those sprints. Only stories count - bugs, tasks and features never add points. ` +
    `Open work is the stories still with the developers - not started or in development (${devStateNames()}); ` +
    `stories in ${(STATS.handedOffStates || []).join(' / ') || 'a handed-off state'} are with QA and aren't counted, nor are done ones. ` +
    `Open work divided by velocity gives the sprints left, and so the likely finish. ` +
    `Effort left multiplies those working days by the people currently closing work: it is combined effort in person-days, ` +
    `not how long it will take. A person's "days to clear" is their own open work at their own pace. ` +
    `Work done counts completed PRs plus closed stories, bugs and tasks. ` +
    (team.areaPaths.length || (team.titlePrefixes || []).length
      ? 'The backlog is every open story, bug and task ' +
        [team.areaPaths.length ? 'under this team\'s area paths' : '',
         (team.titlePrefixes || []).length ? `titled ${team.titlePrefixes.map(p => `"${p} - ..."`).join(' or ')}` : '']
          .filter(Boolean).join(' or ') +
        ', assigned or not; tasks and bugs go with their story. '
      : 'The backlog is the open work assigned to these members, so unassigned stories aren\'t counted. ' +
        'Add <code>titlePrefixes</code> or <code>areaPaths</code> to this team to include them. ') +
    (team.members ? '' : 'Members are everyone with a PR in these repos since the stats window began. ') +
    'PR counts cover PRs opened in these repos since then, plus any still open.';
  section.appendChild(note);
  return section;
}

function prLegend() {
  const legend = el('div', 'legend-row');
  for (const s of PR_STATES) {
    const span = el('span');
    const key = el('i', 'key');
    key.style.background = `var(--pr-${s.key})`;
    span.appendChild(key);
    span.appendChild(document.createTextNode(s.label + ' PRs'));
    legend.appendChild(span);
  }
  return legend;
}

/* People, busiest first. opts.activity adds when each person was active and how
   their output compares with everyone's over that stretch (the People tab). */
function personTable(rows, unit, opts = {}) {
  const from     = opts.from || 0;
  const maxPr    = Math.max(1, ...rows.map(p => p.prTotal));
  const maxPts   = Math.max(1, ...rows.map(p => p.points));
  const maxWork  = Math.max(1, ...rows.map(p => p.workDone));
  const sprintOk = (v, i) => i >= from && SPRINTS[i].complete;
  const maxSpark = Math.max(1, ...rows.flatMap(p => p.sprints.filter(sprintOk)));

  const table = el('table', 'members');
  const head = el('tr');
  const columns = [['Person', 'who']];
  if (opts.activity) columns.push(['Teams', 'who'], ['First active'], ['Last active'], ['Days active']);
  columns.push(['Work done', 'who']);
  if (opts.activity) columns.push(['Pace / sprint'], ['Share while active']);
  columns.push(['Pull requests', 'who'], ['Open drafts'], ['Stories closed'], ['Points closed'],
    ['Avg pts / story'], [`Velocity (${unit} / sprint)`, 'who'], ['Open stories'], [`Open ${unit}`]);
  if (opts.daysToClear) columns.push(['Days to clear']);
  columns.push(['Task hrs left']);
  columns.forEach(([label, cls]) => head.appendChild(el('th', cls || null, label)));
  const thead = el('thead'); thead.appendChild(head); table.appendChild(thead);

  const num = (tr, n, text, tip) => {
    const td = tr.appendChild(el('td', n ? null : 'zero', text != null ? text : fmt(n)));
    if (tip) td.dataset.tip = tip;
    return td;
  };
  const body = el('tbody');

  for (const p of rows) {
    const tr = el('tr');
    tr.appendChild(el('td', 'who', p.name));

    const act = p.act;
    if (opts.activity) {
      const teams = opts.teamsOf ? opts.teamsOf(p.id) : [];
      tr.appendChild(el('td', 'who' + (teams.length ? '' : ' zero'), teams.length ? teams.join(', ') : '-'));
      const firstCell = num(tr, act ? 1 : 0, act ? shortDay(act.since) : '-');
      if (act && act.early) {
        firstCell.appendChild(el('span', 'flag', ' *'));
        firstCell.dataset.tip = `Already active when Snoop's history starts (${longDay(toDate(STATS.from))}),\n` +
          `so they very likely started earlier. Raise stats.monthsBack to look further back.`;
      }
      num(tr, act ? 1 : 0, act ? shortDay(act.until) : '-');
      num(tr, act ? act.days : 0, act ? fmt(act.days) : '-',
        act ? `${longDay(act.since)} - ${longDay(act.until)}\n${fmt(act.workdays)} working days` : null);
    }

    // Work done: bar length against the busiest person, what it's made of underneath.
    const w = p.work;
    const workCell = el('td', 'who' + (p.workDone ? '' : ' zero'));
    if (p.workDone) {
      const bar = el('span', 'hbar');
      bar.style.width = Math.max(2, 90 * p.workDone / maxWork) + 'px';
      workCell.appendChild(bar);
    }
    workCell.appendChild(document.createTextNode(fmt(p.workDone)));
    const parts = [[w.prs, 'PR'], [w.stories, 'story'], [w.bugs, 'bug'], [w.tasks, 'task']]
      .filter(([n]) => n).map(([n, word]) => plural(n, word));
    workCell.appendChild(el('div', 'caption', parts.length ? parts.join(' · ') : 'nothing finished'));
    workCell.dataset.tip = `Completed PRs: ${w.prs}\nStories closed: ${w.stories}\nBugs closed: ${w.bugs}\nTasks closed: ${w.tasks}`;
    tr.appendChild(workCell);

    if (opts.activity) {
      const pace = act ? p.workDone / Math.max(1, act.workdays / SPRINT_WORKDAYS) : null;
      num(tr, pace, pace == null ? '-' : fmt(pace),
        act ? `${fmt(p.workDone)} finished over ${fmt(act.workdays)} working days active\n= ${fmt(pace)} per ${STATS.sprintDays}-day sprint` : null);
      const share = shareWhileActive(p.id, act);
      num(tr, share, share == null ? '-' : Math.round(share * 100) + '%',
        share == null ? null : `${Math.round(share * 100)}% of all work finished by anyone\nbetween ${longDay(act.since)} and ${longDay(act.until)}`);
    }

    // PRs: bar length is volume against the busiest person, segments are outcomes.
    const prCell = el('td', 'stackcell');
    if (p.prTotal) {
      const pct = n => Math.round(100 * n / p.prTotal);
      prCell.dataset.tip = PR_STATES.map(s => `${s.label}: ${p.prs[s.key]} (${pct(p.prs[s.key])}%)`).join('\n');
      const row = el('div');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '7px';
      const stack = el('div', 'stack');
      stack.style.width = Math.max(6, 150 * p.prTotal / maxPr) + 'px';
      for (const s of PR_STATES) {
        const n = p.prs[s.key];
        if (!n) continue;
        const seg = el('div');
        seg.style.flex = String(n);
        seg.style.background = `var(--pr-${s.key})`;
        seg.dataset.tip = `${s.label}: ${n} of ${p.prTotal} (${pct(n)}%)`;
        stack.appendChild(seg);
      }
      row.appendChild(stack);
      row.appendChild(el('span', null, p.prTotal));
      prCell.appendChild(row);
      prCell.appendChild(el('div', 'caption',
        `${pct(p.prs.completed)}% completed - ${pct(p.prs.abandoned)}% abandoned - ${pct(p.prs.active + p.prs.draft)}% open`));
    } else {
      prCell.appendChild(el('span', 'caption', 'no PRs'));
    }
    tr.appendChild(prCell);

    num(tr, p.prs.draft);
    num(tr, p.done);

    const ptsCell = el('td', p.points ? null : 'zero');
    if (p.points) {
      const bar = el('span', 'hbar');
      bar.style.width = Math.max(2, 70 * p.points / maxPts) + 'px';
      ptsCell.appendChild(bar);
    }
    ptsCell.appendChild(document.createTextNode(fmt(p.points)));
    tr.appendChild(ptsCell);

    num(tr, p.avgPoints);

    const velCell = el('td', 'who');
    velCell.appendChild(sparkline(p.sprints.filter(sprintOk), maxSpark));
    velCell.appendChild(document.createTextNode(fmt(p.velocity)));
    velCell.dataset.tip = SPRINTS.map((s, i) => i < from ? null : `${shortDay(s.from)}${s.complete ? '' : ' (now)'}: ${fmt(p.sprints[i])}`)
      .filter(Boolean).join('\n');
    tr.appendChild(velCell);

    num(tr, p.open);
    num(tr, p.remaining);
    if (opts.daysToClear) num(tr, p.workdays, p.remaining <= 0 ? '-' : isFinite(p.workdays) ? fmt(Math.ceil(p.workdays)) : 'no pace yet');
    num(tr, p.taskHours);
    body.appendChild(tr);
  }
  table.appendChild(body);

  const wrap = el('div', 'scroll-x');
  wrap.appendChild(table);
  return wrap;
}

function renderTeamOverview(models) {
  const box = el('div');
  box.appendChild(el('h3', null, `ALL TEAMS - STATS SINCE ${longDay(toDate(STATS.from)).toUpperCase()}`));

  const table = el('table');
  const head = el('tr');
  [['Team', 'who'], ['Members'], ['Velocity / sprint'], ['Open work'], ['Working days left'],
   ['Likely finish'], ['Fast - slow'], ['Open PRs'], ['Drafts']]
    .forEach(([label, cls]) => head.appendChild(el('th', cls || null, label)));
  const thead = el('thead'); thead.appendChild(head); table.appendChild(thead);

  const body = el('tbody');
  models.forEach((model, index) => {
    const fc = model.forecast;
    const tr = el('tr');
    const who = el('td', 'who');
    who.appendChild(teamLink(model.team.name, index));
    tr.appendChild(who);
    tr.appendChild(el('td', null, model.people.length));
    tr.appendChild(el('td', null, `${fmt(fc.rates.avg)} ${model.unit}`));
    tr.appendChild(el('td', null, `${fmt(model.remaining)} ${model.unit}`));
    tr.appendChild(el('td', null, fc.remaining <= 0 ? '-' : isFinite(fc.avg.workdays) ? fmt(Math.ceil(fc.avg.workdays)) : 'no pace yet'));
    tr.appendChild(el('td', null, fc.avg.date ? longDay(fc.avg.date) : '-'));
    tr.appendChild(el('td', null, fc.high.date && fc.remaining > 0
      ? `${shortDay(fc.high.date)} - ${fc.low.date ? shortDay(fc.low.date) : '?'}` : '-'));
    const prs = s => model.prs.filter(pr => pr.s === s).length;
    tr.appendChild(el('td', null, prs('active') + prs('draft')));
    tr.appendChild(el('td', null, prs('draft')));
    body.appendChild(tr);
  });
  table.appendChild(body);

  const wrap = el('div', 'scroll-x');
  wrap.appendChild(table);
  box.appendChild(wrap);
  return box;
}

let TEAM_MODELS = [];

/* The Teams tab shows one team at a time, picked from a row of sub-tabs, with
   an overview of them all when there's more than one. */
function teamLink(label, key) {
  const link = el('a', 'teamlink' + (key === teamState.selected ? ' on' : ''), label);
  link.href = '#teams' + (key === 'overview' ? '' : '/' + key);
  link.addEventListener('click', e => { e.preventDefault(); selectTeam(key); });
  return link;
}

function selectTeam(key) {
  teamState.selected = key;
  renderTeams();
  showView('teams');
  document.querySelector('.main').scrollTop = 0;
}

function renderTeams() {
  const view = document.getElementById('teamsView');
  view.innerHTML = '';
  if (!STATS) {
    view.appendChild(el('div', 'empty-state', 'Team stats were skipped for this run (-SkipTeamStats).'));
    return;
  }

  const models = TEAM_MODELS = STATS.teams.map(teamModel);
  const several = models.length > 1;
  if (teamState.selected === 'overview' ? !several : !models[teamState.selected]) {
    teamState.selected = several ? 'overview' : 0;
  }

  const tabs = el('div', 'subtabs');
  const keys = [...(several ? [['overview', 'Overview']] : []), ...models.map((m, i) => [i, m.team.name])];
  for (const [key, label] of keys) {
    const button = el('button', key === teamState.selected ? 'on' : null, label);
    button.type = 'button';
    button.addEventListener('click', () => selectTeam(key));
    tabs.appendChild(button);
  }
  view.appendChild(tabs);

  view.appendChild(teamState.selected === 'overview'
    ? renderTeamOverview(models)
    : renderTeamSection(models[teamState.selected], teamState.selected));

  const links = document.getElementById('teamLinks');
  links.innerHTML = '';
  for (const [key, label] of keys) {
    const link = teamLink(label, key);
    link.style.display = 'block';
    link.style.padding = '3px 0';
    links.appendChild(link);
  }
}

/* ---------- people ---------- */

/* Everyone on the roster, across every team and repo. */
function renderPeople() {
  const view = document.getElementById('peopleView');
  view.innerHTML = '';
  if (!STATS) {
    view.appendChild(el('div', 'empty-state', 'Stats were skipped for this run (-SkipTeamStats).'));
    return;
  }

  const scope  = workScope(STATS.prs, STATS.items);
  const first  = scope.velocity.findIndex(v => v > 0);
  const rows   = personRows(DATA.people.map(p => p.id), scope, recentSprints(first));
  const teamsOf = id => TEAM_MODELS.filter(m => m.people.some(p => p.id === id)).map(m => m.team.name);

  view.appendChild(el('h3', null,
    `EVERYONE - ALL TEAMS AND REPOS SINCE ${longDay(toDate(STATS.from)).toUpperCase()} - MOST WORK DONE FIRST`));
  view.appendChild(prLegend());
  view.appendChild(personTable(rows, scope.unit, { activity: true, teamsOf, from: Math.max(0, first - 1) }));

  const note = el('p', 'note');
  note.innerHTML =
    `<b>How this is worked out.</b> Everything here covers every repo and work item project in the config, ` +
    `not one team. <b>Work done</b> counts completed PRs plus closed stories, bugs and tasks. ` +
    `<b>First</b> and <b>last active</b> are the first and last time someone opened or closed a PR, closed a work item, ` +
    `or showed up on the Activity tab; Snoop's history starts ${longDay(toDate(STATS.from))}, ` +
    `so a <span class="flag">*</span> means they were already active then. <b>Days active</b> is the span between the two. ` +
    `Because newcomers and old hands have had very different amounts of time, the last two columns even it out: ` +
    `<b>pace</b> is work done per ${STATS.sprintDays}-day sprint while they were active, and <b>share while active</b> ` +
    `is their slice of all the work anyone on the roster finished between their first and last active days. ` +
    `Velocity likewise only averages the sprints since each person's first activity. Only stories count towards points.`;
  view.appendChild(note);
}

function renderStats() {
  renderTeams();
  renderPeople();
}

function renderVelocityWindow() {
  const box = document.getElementById('velocityWindow');
  if (!STATS) return;
  const choices = [...new Set([3, 6, STATS.velocitySprints])].filter(n => n > 0).sort((a, b) => a - b);
  for (const n of [...choices, 0]) {
    const label = el('label', 'opt');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'velocityWindow';
    input.checked = n === teamState.velocitySprints;
    input.addEventListener('change', () => { teamState.velocitySprints = n; renderStats(); });
    label.appendChild(input);
    label.appendChild(document.createTextNode(n ? `Last ${n} sprints` : 'Every sprint since work began'));
    box.appendChild(label);
  }
}
/* ---------- tabs and tooltip ---------- */

function showView(view) {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === view));
  document.getElementById('activityView').hidden     = view !== 'activity';
  document.getElementById('activityControls').hidden = view !== 'activity';
  document.getElementById('teamsView').hidden        = view !== 'teams';
  document.getElementById('teamControls').hidden     = view !== 'teams';
  document.getElementById('peopleView').hidden       = view !== 'people';
  document.getElementById('statsControls').hidden    = view === 'activity';
  const team = view === 'teams' && teamState.selected !== 'overview' ? '/' + teamState.selected : '';
  history.replaceState(null, '', '#' + view + team);
  // The grid pins its band heights after layout, which needs it on screen.
  if (view === 'activity') render();
}

document.querySelectorAll('.tabs button').forEach(button =>
  button.addEventListener('click', () => showView(button.dataset.view)));

const tooltip = el('div', 'tip');
tooltip.hidden = true;
document.body.appendChild(tooltip);
document.addEventListener('mousemove', e => {
  const target = e.target.closest && e.target.closest('[data-tip]');
  if (!target) { tooltip.hidden = true; return; }
  tooltip.textContent = target.getAttribute('data-tip');
  tooltip.hidden = false;
  const pad = 14, box = tooltip.getBoundingClientRect();
  let left = e.clientX + pad, top = e.clientY + pad;
  if (left + box.width > innerWidth - 8)  left = e.clientX - box.width - pad;
  if (top + box.height > innerHeight - 8) top = e.clientY - box.height - pad;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = top + 'px';
});

/* ---------- refresh (only when snoop.exe is serving the page) ---------- */

function setupRefresh() {
  if (!location.protocol.startsWith('http')) return;   // a saved snoop.html has nothing to call
  const box = document.getElementById('refreshBox');
  const button = document.getElementById('refreshBtn');
  const line = document.getElementById('refreshStatus');
  box.hidden = false;

  const meta = DATA.meta;
  const idle = () => {
    line.className = 'status';
    line.textContent = `Updated ${meta.generated.slice(11)}` +
      (meta.requests ? ` - ${meta.requests} requests, ${meta.seconds}s` : '');
  };
  idle();

  async function poll() {
    let s;
    try { s = await (await fetch('/api/status')).json(); }
    catch (e) { line.textContent = 'Snoop is not running.'; button.disabled = false; return; }
    if (s.running) {
      button.disabled = true;
      button.textContent = 'Refreshing...';
      line.className = 'status';
      line.textContent = `${s.requests} requests, ${s.seconds}s`;
      setTimeout(poll, 700);
      return;
    }
    button.disabled = false;
    button.textContent = 'Refresh';
    if (s.error) { line.className = 'status error'; line.textContent = s.error; return; }
    if (s.generated && s.generated !== String(meta.run)) location.reload();
    else idle();
  }

  button.addEventListener('click', async () => {
    button.disabled = true;
    await fetch('/api/refresh', { method: 'POST' }).catch(() => {});
    poll();
  });
  poll();   // picks up a refresh that was already running when the page loaded
}

renderChrome();
renderLegend();
setupRefresh();
renderVelocityWindow();
// #teams, #teams/2 (the third team) or #people.
const [hashView, hashTeam] = location.hash.slice(1).split('/');
if (hashTeam && /^\d+$/.test(hashTeam)) teamState.selected = Number(hashTeam);
renderStats();
showView(['teams', 'people'].includes(hashView) ? hashView : 'activity');
</script>
